# Wrangler config — Cloudflare reads this on every Git deploy.
#
# `name` MUST match the Worker name in Cloudflare ("safemcp").
# `main` points to the Worker script Astro's Cloudflare adapter generates.
# `[assets]` tells Wrangler to serve static files from dist/.

name = "safemcp"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
main = "./dist/_worker.js/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"

# D1 binding — read in dynamic pages as Astro.locals.runtime.env.DB
#
# After creating the D1 database in Cloudflare dashboard, paste the ID below.
[[d1_databases]]
binding = "DB"
database_name = "safemcp-servers"
database_id = "24f86147-59a3-4140-9187-49ef65611a9e"

# KV binding for API beta signup form (form on /api-beta).
# Stores: app:* keys (one per submission), rate:* keys (IP rate limits), meta:total counter.
[[kv_namespaces]]
binding = "API_BETA_SIGNUPS"
id = "891a68761c134b5fa959b5995741f4e7"
